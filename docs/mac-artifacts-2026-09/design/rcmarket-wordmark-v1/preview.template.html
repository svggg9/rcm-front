<div id="rcmarket-vector-directions" aria-label="Шесть вариантов рцмаркет с favicon">
<style>
#rcmarket-vector-directions{font:400 14px/1.5 Arial,sans-serif;background:#fff;color:#111}
#rcmarket-vector-directions *{box-sizing:border-box}
#rcmarket-vector-directions .rv-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px 24px}
#rcmarket-vector-directions h2{font:400 15px/24px Arial,sans-serif;margin:0 0 8px}
#rcmarket-vector-directions .rv-dark{height:104px;background:#111;display:grid;place-items:center;padding:22px}
#rcmarket-vector-directions .rv-dark img{width:100%;max-width:260px;height:56px;object-fit:contain}
#rcmarket-vector-directions .rv-detail{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 0}
#rcmarket-vector-directions .rv-mobile{width:140px;height:32px;object-fit:contain;object-position:left center}
#rcmarket-vector-directions .rv-icons{display:flex;gap:10px;align-items:center}
#rcmarket-vector-directions .rv-icons img{display:block;flex:none}
#rcmarket-vector-directions .rv-note{font:400 12px/18px Arial,sans-serif;color:#666;margin-bottom:12px;min-height:36px}
#rcmarket-vector-directions button{font:400 14px/22px Arial,sans-serif;border:1px solid #111;border-radius:0;padding:10px 15px;background:#fff;color:#111;cursor:pointer;transition:transform 140ms ease}
#rcmarket-vector-directions button[aria-pressed=true]{background:#111;color:#fff}
#rcmarket-vector-directions button:active{transform:translateY(1px) scale(.985)}
#rcmarket-vector-directions .rv-result{font-size:14px;line-height:22px;color:#626262;margin-top:18px}
#rcmarket-vector-directions .rv-result:empty{display:none}
@media(max-width:570px){#rcmarket-vector-directions .rv-grid{grid-template-columns:1fr}#rcmarket-vector-directions .rv-note{min-height:0}}
@media(prefers-reduced-motion:reduce){#rcmarket-vector-directions button{transition:none}#rcmarket-vector-directions button:active{transform:none}}
</style>
<div class="rv-grid">
<section><h2>01 · Характер</h2><div class="rv-dark"><img src="{{01-yeseva-white}}" alt="рцмаркет — Yeseva One"></div><div class="rv-detail"><img class="rv-mobile" src="{{01-yeseva-black}}" alt="рцмаркет, ширина 140 пикселей"><div class="rv-icons"><img src="{{01-yeseva-favicon}}" width="16" height="16" alt="Favicon 16 пикселей"><img src="{{01-yeseva-favicon}}" width="32" height="32" alt="Favicon 32 пикселя"></div></div><div class="rv-note">Yeseva One · шрифтовая основа</div><button type="button" data-choice="01 · Характер" aria-pressed="false">Выбрать 01</button></section>
<section><h2>02 · Чистота</h2><div class="rv-dark"><img src="{{02-manrope-white}}" alt="рцмаркет — Manrope"></div><div class="rv-detail"><img class="rv-mobile" src="{{02-manrope-black}}" alt="рцмаркет, ширина 140 пикселей"><div class="rv-icons"><img src="{{02-manrope-favicon}}" width="16" height="16" alt="Favicon 16 пикселей"><img src="{{02-manrope-favicon}}" width="32" height="32" alt="Favicon 32 пикселя"></div></div><div class="rv-note">Manrope 600 · шрифтовая основа</div><button type="button" data-choice="02 · Чистота" aria-pressed="false">Выбрать 02</button></section>
<section><h2>03 · Широта</h2><div class="rv-dark"><img src="{{03-unbounded-white}}" alt="рцмаркет — Unbounded"></div><div class="rv-detail"><img class="rv-mobile" src="{{03-unbounded-black}}" alt="рцмаркет, ширина 140 пикселей"><div class="rv-icons"><img src="{{03-unbounded-favicon}}" width="16" height="16" alt="Favicon 16 пикселей"><img src="{{03-unbounded-favicon}}" width="32" height="32" alt="Favicon 32 пикселя"></div></div><div class="rv-note">Unbounded 500 · шрифтовая основа</div><button type="button" data-choice="03 · Широта" aria-pressed="false">Выбрать 03</button></section>
<section><h2>04 · Геометрия</h2><div class="rv-dark"><img src="{{04-geometric-white}}" alt="рцмаркет — геометрия"></div><div class="rv-detail"><img class="rv-mobile" src="{{04-geometric-black}}" alt="рцмаркет, ширина 140 пикселей"><div class="rv-icons"><img src="{{04-geometric-favicon}}" width="16" height="16" alt="Favicon 16 пикселей"><img src="{{04-geometric-favicon}}" width="32" height="32" alt="Favicon 32 пикселя"></div></div><div class="rv-note">Авторская конструкция · ровный штрих</div><button type="button" data-choice="04 · Геометрия" aria-pressed="false">Выбрать 04</button></section>
<section><h2>05 · Срез</h2><div class="rv-dark"><img src="{{05-cut-white}}" alt="рцмаркет — срез"></div><div class="rv-detail"><img class="rv-mobile" src="{{05-cut-black}}" alt="рцмаркет, ширина 140 пикселей"><div class="rv-icons"><img src="{{05-cut-favicon}}" width="16" height="16" alt="Favicon 16 пикселей"><img src="{{05-cut-favicon}}" width="32" height="32" alt="Favicon 32 пикселя"></div></div><div class="rv-note">Авторская конструкция · угловатые формы</div><button type="button" data-choice="05 · Срез" aria-pressed="false">Выбрать 05</button></section>
<section><h2>06 · Клин</h2><div class="rv-dark"><img src="{{06-wedge-white}}" alt="рцмаркет — клин"></div><div class="rv-detail"><img class="rv-mobile" src="{{06-wedge-black}}" alt="рцмаркет, ширина 140 пикселей"><div class="rv-icons"><img src="{{06-wedge-favicon}}" width="16" height="16" alt="Favicon 16 пикселей"><img src="{{06-wedge-favicon}}" width="32" height="32" alt="Favicon 32 пикселя"></div></div><div class="rv-note">Авторская конструкция · короткие засечки</div><button type="button" data-choice="06 · Клин" aria-pressed="false">Выбрать 06</button></section>
</div>
<div class="rv-result" role="status" aria-live="polite"></div>
<script>
(()=>{const root=document.getElementById('rcmarket-vector-directions');root.querySelectorAll('[data-choice]').forEach(button=>button.addEventListener('click',()=>{root.querySelectorAll('[data-choice]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));root.querySelector('.rv-result').textContent='Для доработки: '+button.dataset.choice}));const state={width:260};function render(){root.querySelectorAll('.rv-dark img').forEach(img=>img.style.maxWidth=state.width+'px')}if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSlider(state,'width',{label:'Ширина логотипа на чёрном',min:140,max:280,step:10,unit:'px'})}})();
</script>
</div>
