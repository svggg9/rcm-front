<div id="rcm-public-header" aria-label="Шапка публичного сайта рцмаркет">
  <style>
    #rcm-public-header{font-family:Arial,sans-serif;font-weight:400;color:#111;background:#fff;--rh-height:100px;--rh-icon:32px}
    #rcm-public-header *{box-sizing:border-box}
    #rcm-public-header .rh-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:var(--rh-height);padding:0 26px;background:#111;color:#fff}
    #rcm-public-header .rh-side{display:flex;align-items:center;gap:32px}
    #rcm-public-header .rh-side:last-child{justify-content:flex-end}
    #rcm-public-header .rh-action{display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;border-radius:0;background:transparent;color:#fff;cursor:pointer;transition:transform 140ms ease,opacity 140ms ease}
    #rcm-public-header .rh-action:hover{opacity:.75}
    #rcm-public-header .rh-action:active{transform:translateY(1px) scale(.985)}
    #rcm-public-header .rh-logo{display:grid;place-items:center;width:224px;line-height:0;padding:0;color:#fff;text-decoration:none}
    #rcm-public-header .rh-logo img{display:block;width:100%;height:auto}
    #rcm-public-header .rh-icon{display:block;width:var(--rh-icon);height:var(--rh-icon);background-position:center;background-repeat:no-repeat;background-size:contain}

    #rcm-public-header .rh-selection:empty{display:none}
    @media(max-width:540px){#rcm-public-header .rh-bar{min-height:76px;padding:0 8px}#rcm-public-header .rh-side{gap:0}#rcm-public-header .rh-logo{width:clamp(92px,calc(100vw - 208px),180px)}#rcm-public-header .rh-icon{width:26px;height:26px}}
    @media(prefers-reduced-motion:reduce){#rcm-public-header .rh-action{transition:none}#rcm-public-header .rh-action:active{transform:none}}
  </style>
  <header class="rh-bar">
    <div class="rh-side">
      <button type="button" class="rh-action" aria-label="Меню"><span class="rh-icon rh-menu" aria-hidden="true"></span></button>
      <button type="button" class="rh-action" aria-label="Избранное"><span class="rh-icon rh-heart" aria-hidden="true"></span></button>
    </div>
    <a class="rh-logo" href="#" aria-label="рцмаркет — главная"><img src="{{WORDMARK_WHITE}}" alt="рцмаркет"></a>
    <div class="rh-side">
      <button type="button" class="rh-action" aria-label="Поиск"><span class="rh-icon rh-search" aria-hidden="true"></span></button>
      <button type="button" class="rh-action" aria-label="Корзина"><span class="rh-icon rh-bag" aria-hidden="true"></span></button>
    </div>
  </header>
  <div class="rh-selection" role="status" aria-live="polite"></div>
  <script>
    (()=>{const root=document.getElementById('rcm-public-header');const status=root.querySelector('.rh-selection');root.querySelectorAll('.rh-action').forEach(button=>button.addEventListener('click',()=>{status.textContent=button.getAttribute('aria-label')+' · предварительный макет'}));root.querySelector('.rh-logo').addEventListener('click',e=>{e.preventDefault();status.textContent=''});const state={height:100,icons:32};function render(){root.style.setProperty('--rh-height',state.height+'px');root.style.setProperty('--rh-icon',state.icons+'px')}if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSlider(state,'height',{label:'Высота шапки',min:80,max:112,step:4,unit:'px'});tweak.addSlider(state,'icons',{label:'Размер иконок',min:24,max:36,step:2,unit:'px'})}})();
  </script>
</div>
